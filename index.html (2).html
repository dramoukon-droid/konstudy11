<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>KonStudy — Ψηφιακή Πλατφόρμα Λυκείου</title>
    <style>
        /* =====================================================================
           1. BESPOKE EDITORIAL DARK ARCHITECTURE (Zero External Dependencies)
           ===================================================================== */
        :root {
            --bg-0: #040711;
            --bg-1: #0a1020;
            --surface: rgba(12, 19, 37, 0.88);
            --surface-solid: #0c1325;
            --border: rgba(148, 163, 184, 0.16);
            --border-strong: rgba(56, 189, 248, 0.48);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sky: #38bdf8;
            --indigo: #818cf8;
            --emerald: #34d399;
            --amber: #fbbf24;
            --rose: #fb7185;
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-sans);
            background: var(--bg-0);
            color: var(--text-main);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Ambient Aurora & Architectural Mesh */
        .bg-aura {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(1000px circle at 10% -10%, rgba(14, 165, 233, 0.16), transparent 55%),
                radial-gradient(900px circle at 92% 8%, rgba(99, 102, 241, 0.14), transparent 52%),
                radial-gradient(800px circle at 50% 105%, rgba(16, 185, 129, 0.09), transparent 55%),
                var(--bg-0);
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.024) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(ellipse at 50% 35%, #000 35%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 35%, transparent 85%);
            pointer-events: none;
        }
        #ambientCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            padding: 28px 0 56px;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(4, 7, 17, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }
        .nav-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            text-align: left;
            padding: 0;
        }
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            padding: 1.5px;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
        }
        .brand-mark-inner {
            width: 100%;
            height: 100%;
            border-radius: 11.5px;
            background: #060b19;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 19px;
            color: var(--sky);
        }
        .brand-title {
            font-size: 17.5px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-pill {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--emerald);
        }
        .brand-sub {
            font-size: 11px;
            color: var(--text-muted);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #cbd5e1;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            padding: 8px 13px;
            border-radius: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            color: #fff;
            background: rgba(30, 41, 59, 0.65);
        }
        .nav-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #bae6fd;
        }

        /* Surfaces */
        .panel {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 22px 48px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .panel-interactive {
            transition: transform 0.22s cubic-bezier(.22,1,.36,1), border-color 0.22s ease, box-shadow 0.22s ease;
        }
        .panel-interactive:hover {
            transform: translateY(-3px);
            border-color: var(--border-strong);
            box-shadow: 0 26px 50px -18px rgba(14, 165, 233, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .sub-box {
            background: rgba(6, 10, 22, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        /* Badges & Typography */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(56, 189, 248, 0.11);
            color: #7dd3fc;
        }
        .badge-emerald { border-color: rgba(52, 211, 153, 0.34); background: rgba(52, 211, 153, 0.11); color: #6ee7b7; }
        .badge-amber { border-color: rgba(251, 191, 36, 0.34); background: rgba(251, 191, 36, 0.11); color: #fcd34d; }
        .badge-indigo { border-color: rgba(129, 140, 248, 0.34); background: rgba(129, 140, 248, 0.12); color: #c7d2fe; }
        .badge-rose { border-color: rgba(251, 113, 133, 0.36); background: rgba(251, 113, 133, 0.12); color: #fda4af; }

        h1 { margin: 0; font-size: clamp(24px, 3.6vw, 40px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; color: #fff; }
        h2 { margin: 0; font-size: clamp(18px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.015em; color: #fff; }
        h3 { margin: 0; font-size: 16px; font-weight: 800; color: #fff; }
        .muted { color: var(--text-muted); }
        .mono { font-family: var(--font-mono); }

        /* Inputs & Buttons */
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            background: #050915;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--sky);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
        }
        label.field-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            padding: 11px 18px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.18s ease;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn-sky { background: var(--sky); color: #040914; }
        .btn-sky:hover:not(:disabled) { background: #7dd3fc; }
        .btn-emerald { background: var(--emerald); color: #04130d; }
        .btn-emerald:hover:not(:disabled) { background: #6ee7b7; }
        .btn-amber { background: var(--amber); color: #160e02; }
        .btn-amber:hover:not(:disabled) { background: #fde047; }
        .btn-ghost { background: rgba(15, 23, 42, 0.88); border-color: rgba(148, 163, 184, 0.24); color: #e2e8f0; }
        .btn-ghost:hover:not(:disabled) { background: rgba(30, 41, 59, 0.92); border-color: rgba(148, 163, 184, 0.42); }
        .btn-soft-sky { background: rgba(56, 189, 248, 0.14); border-color: rgba(56, 189, 248, 0.34); color: #bae6fd; }
        .btn-soft-sky:hover:not(:disabled) { background: rgba(56, 189, 248, 0.24); }
        .btn-danger { background: rgba(251, 113, 133, 0.14); border-color: rgba(251, 113, 133, 0.36); color: #fda4af; }
        .btn-danger:hover:not(:disabled) { background: rgba(251, 113, 133, 0.25); }
        .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 10px; }

        /* Honeypot anti-bot field */
        .hp-field {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* Layout Helpers */
        .stack { display: flex; flex-direction: column; gap: 22px; }
        .stack-sm { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
        .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
        .grid-10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
        @media (max-width: 640px) {
            .grid-10 { grid-template-columns: repeat(5, 1fr); }
            .panel { padding: 18px; }
        }

        /* Schedule Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid rgba(148, 163, 184, 0.12); }
        th { color: var(--sky); font-weight: 800; background: rgba(7, 11, 23, 0.7); }
        tr:hover td { background: rgba(15, 23, 42, 0.45); }

        /* Cookie Banner */
        #cookieBannerRoot {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 85;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        .cookie-card {
            pointer-events: auto;
            max-width: 820px;
            width: 100%;
            background: rgba(8, 13, 28, 0.97);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
        }

        /* Toast */
        #toastBox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99;
            max-width: 420px;
            padding: 13px 18px;
            border-radius: 14px;
            background: rgba(9, 14, 28, 0.96);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #f8fafc;
            font-size: 12.5px;
            font-weight: 700;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75);
            display: none;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .view-enter { animation: viewEnter 0.26s cubic-bezier(.22,1,.36,1) forwards; }

        footer {
            position: relative;
            z-index: 10;
            border-top: 1px solid var(--border);
            background: rgba(4, 7, 17, 0.9);
            padding: 20px 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .link-btn {
            background: none;
            border: none;
            color: var(--sky);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

        /* Print / A4 PDF Sheet */
        #examPrintSheet {
            background: #ffffff;
            color: #0f172a;
            border-radius: 20px;
            padding: 36px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        }
        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            .no-print, header, footer, #ambientCanvas, .bg-aura, .bg-grid, #toastBox, #cookieBannerRoot { display: none !important; }
            main { padding: 0 !important; }
            .container { max-width: 100% !important; padding: 0 !important; }
            #examPrintSheet {
                display: block !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                border-radius: 0 !important;
            }
            #examPrintSheet * { color: #000000 !important; border-color: #1e293b !important; }
        }
    </style>
</head>
<body>
    <div class="bg-aura no-print"></div>
    <div class="bg-grid no-print"></div>
    <canvas id="ambientCanvas" class="no-print"></canvas>
    <div id="toastBox" class="no-print"></div>
    <div id="cookieBannerRoot" class="no-print"></div>

    <!-- Header -->
    <header class="no-print">
        <div class="container nav-bar">
            <button type="button" class="brand" onclick="navigate('home')">
                <div class="brand-mark"><div class="brand-mark-inner">K</div></div>

    <!-- Main Workspace (Page-by-Page Views) -->
    <main>
        <div id="appRoot" class="container"></div>
    </main>

    <!-- Legal & GDPR Compliant Footer -->
    <footer class="no-print">
        <div class="container stack-sm" style="gap:10px;">
            <div class="row-between">
                <div class="row">
                    <span style="width:8px;height:8px;border-radius:50%;background:#34d399;display:inline-block;"></span>
                    <span><strong style="color:#f1f5f9;">KonStudy</strong> • Ψηφιακή Πλατφόρμα Λυκείου</span>
                </div>
                <div class="row" style="gap:16px;">
                    <button type="button" class="link-btn" onclick="openLegalPage('privacy')">Πολιτική Απορρήτου (/privacy)</button>
                    <button type="button" class="link-btn" onclick="openLegalPage('terms')">Όροι Χρήσης (/terms)</button>
                    <button type="button" class="link-btn" onclick="reopenCookieBanner()">Ρυθμίσεις Cookies</button>
                </div>
            </div>
            <div class="row-between" style="font-size:11.5px;color:#64748b;">
                <span>Τα σχολικά βιβλία παραπέμπουν στους επίσημους, ελεύθερα προσβάσιμους πόρους του ΥΠΑΙΘΑ / ΙΤΥΕ «Διόφαντος» (<span class="mono">ebooks.edu.gr</span>).</span>
                <span>Δημιουργία &amp; Ανάπτυξη: <strong style="color:#7dd3fc;">Κωνσταντίνος Δραμουντάνης</strong></span>
            </div>
        </div>
    </footer>

    <script>
        // =====================================================================
        // 1. INLINE SVG ICONS (Zero External Requests)
        // =====================================================================
        const SVG = {
            book: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>`,
            users: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
            calendar: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
            grad: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
            shield: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
            file: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>`,
            arrow: `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`
        };

        // =====================================================================
        // 2. CRYPTOGRAPHY, XSS PROTECTION, RATE LIMITING & UPLOAD VALIDATION
        // =====================================================================
        const CRYPTO_SALT = "KonStudy_Lykeio_2026_SecureSalt!";
        const MAX_UPLOAD_BYTES = 5 * 1024 * 1024; // 5MB limit
        const ALLOWED_UPLOAD_EXTS = [".pdf", ".png", ".jpg", ".jpeg"];
        const ALLOWED_UPLOAD_MIMES = ["application/pdf", "image/png", "image/jpeg"];
        const SESSION_TIMEOUT_MS = 15 * 60 * 1000; // 15 min inactivity auto-logout

        async function sha256Hex(text) {
            const payload = String(text) + CRYPTO_SALT;
            if (window.crypto && window.crypto.subtle) {
                const buf = new TextEncoder().encode(payload);
                const hashBuf = await crypto.subtle.digest("SHA-256", buf);
                return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, "0")).join("");
            }
            let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
            for (let i = 0; i < payload.length; i++) {
                const ch = payload.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
        }

        function esc(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function containsSensitivePII(text) {
            const cleaned = String(text || "");
            return /\b(69\d{8}|2\d{9})\b/.test(cleaned) || /\b\d{9,11}\b/.test(cleaned);
        }

        function isStrongPassword(pass) {
            return typeof pass === "string" &&
                pass.length >= 10 &&
                /[a-z]/.test(pass) &&
                /[A-Z]/.test(pass) &&
                /\d/.test(pass);
        }

        // Per-minute Anti-Spam Rate Limiter
        const rateBuckets = new Map();
        function checkRateLimit(bucketKey, maxPerMinute = 15) {
            const now = Date.now();
            const windowMs = 60 * 1000;
            const prev = (rateBuckets.get(bucketKey) || []).filter(ts => now - ts < windowMs);
            if (prev.length >= maxPerMinute) {
                return false;
            }
            prev.push(now);
            rateBuckets.set(bucketKey, prev);
            return true;
        }

        // Brute-Force Rate Limiting (5 failed attempts -> 60s cooldown)
        const authGuard = {
            adminFails: 0,
            adminLockedUntil: 0,
            teacherFails: 0,
            teacherLockedUntil: 0
        };

        function showToast(msg) {
            const box = document.getElementById("toastBox");
            if (!box) return;
            box.textContent = msg;
            box.style.display = "block";
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => { box.style.display = "none"; }, 4200);
        }

        function detectDeviceLabel() {
            const ua = navigator.userAgent || "";
            let os = "Συσκευή";
            if (/Windows NT 10/i.test(ua)) os = "Windows PC";
            else if (/Mac OS X/i.test(ua) && !/iPhone|iPad/i.test(ua)) os = "MacBook / macOS";
            else if (/iPhone/i.test(ua)) os = "iPhone";
            else if (/iPad/i.test(ua)) os = "iPad";
            else if (/Android/i.test(ua)) os = "Android";
            else if (/Linux/i.test(ua)) os = "Linux";

            let browser = "Browser";
            if (/Edg\//i.test(ua)) browser = "Edge";
            else if (/Chrome\//i.test(ua)) browser = "Chrome";
            else if (/Safari\//i.test(ua)) browser = "Safari";
            else if (/Firefox\//i.test(ua)) browser = "Firefox";
            return `${os} (${browser})`;
        }

        function validateUploadFile(file, requireImage = false) {
            if (!file) return { ok: false, reason: "Δεν επιλέχθηκε αρχείο." };
            if (file.size > MAX_UPLOAD_BYTES) {
                return { ok: false, reason: "Το αρχείο υπερβαίνει το όριο των 5 MB." };
            }
            const lowerName = (file.name || "").toLowerCase();
            const hasAllowedExt = ALLOWED_UPLOAD_EXTS.some(ext => lowerName.endsWith(ext));
            const hasAllowedMime = ALLOWED_UPLOAD_MIMES.includes((file.type || "").toLowerCase());
            if (!hasAllowedExt || !hasAllowedMime) {
                return { ok: false, reason: "Επιτρέπονται μόνο αρχεία .pdf, .png, .jpg, .jpeg." };
            }
            if (requireImage && !(file.type || "").startsWith("image/")) {
                return { ok: false, reason: "Επιτρέπονται μόνο εικόνες (.png, .jpg, .jpeg) για τη φωτογραφία πίνακα." };
            }
            return { ok: true };
        }

        function compressPhotoDataUrl(file, maxDim = 680, quality = 0.68) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                            else { w = Math.round(w * maxDim / h); h = maxDim; }
                        }
                        const c = document.createElement("canvas");
                        c.width = w; c.height = h;
                        c.getContext("2d").drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function createDefaultSchedule() {
            const sch = {};
            SECTIONS_LIST.forEach(sec => {
                sch[sec] = {};
                const gradeCourses = INITIAL_COURSES.filter(c =>
                    sec.startsWith("Α") ? c.grade === "Α' Λυκείου" :
                    sec.startsWith("Β") ? c.grade === "Β' Λυκείου" : c.grade === "Γ' Λυκείου"
                );
                DAYS_LIST.forEach((day, dIdx) => {
                    sch[sec][day] = Array.from({ length: 7 }, (_, h) => {
                        const c = gradeCourses[(dIdx * 3 + h) % gradeCourses.length];
                        return c ? c.title : "Ελεύθερη Ώρα";
                    });
                });
            });
            return sch;
        }

        function loadAppData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("KONSTUDY_DB_V8") || localStorage.getItem("KONSTUDY_DB_V7");
                if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DB));
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.courses)) {
                    parsed.courses.forEach(c => {
                        const fresh = INITIAL_COURSES.find(ic => ic.id === c.id);
                        if (fresh) c.bookUrl = fresh.bookUrl;
                    });
                }
                return {
                    ...JSON.parse(JSON.stringify(DEFAULT_DB)),
                    ...parsed,
                    audit_logs: Array.isArray(parsed.audit_logs) ? parsed.audit_logs : []
                };
            } catch (e) {
                return JSON.parse(JSON.stringify(DEFAULT_DB));
            }
        }

        function saveAppData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            } catch (e) {
                showToast("Ο χώρος αποθήκευσης browser γέμισε. Κάντε λήψη Backup.");
            }
        }

        function logActivity(msg, action = "INFO", actor = "SYSTEM") {
            const iso = new Date().toISOString();
            const ts = new Date().toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
            db.logs.unshift(`[${ts}] ${msg}`);
            if (db.logs.length > 80) db.logs.length = 80;
            db.audit_logs.unshift({
                timestamp: iso,
                actor: String(actor || "SYSTEM"),
                action: String(action || "INFO"),
                details: String(msg || "")
            });
            if (db.audit_logs.length > 200) db.audit_logs.length = 200;
            saveAppData();
        }

        function enforceSessionTimeout() {
            if (!state.currentTeacher && !state.isAdminLoggedIn) return;
            if (Date.now() - state.lastActivityAt > SESSION_TIMEOUT_MS) {
                const prevTeacher = state.currentTeacher?.name;
                state.currentTeacher = null;
                state.currentTeacherSessionVer = 0;
                state.isAdminLoggedIn = false;
                try { sessionStorage.clear(); } catch (e) {}
                logActivity(

                    prevTeacher || "ADMIN"

                showToast("Αποσυνδεθήκατε αυτόματα λόγω αδράνειας για λόγους ασφαλείας.");
                render();
            }
        }

            state.cookieConsent = choice;

        function syncHashRoute(view) {
            const map = {
                home: "#/home",
                sections: "#/sections",
                schedule: "#/schedule",
                exams: "#/exams",
                teacher: "#/teacher",
                admin: "#/admin",
                privacy: "#/privacy",
                terms: "#/terms",
                deleteAccount: "#/delete-account"
            };
            const targetHash = map[view] || "#/home";
            try {
                if (window.location.hash !== targetHash) {
                    history.replaceState(null, "", targetHash);
                }
            } catch (e) {
                window.location.hash = targetHash;
            }
        }

        function navigate(view, extra = {}) {
            touchActivity();
            enforceSessionTimeout();
            if (state.view && state.view !== view && state.view !== "privacy" && state.view !== "terms" && state.view !== "deleteAccount") {
                state.previousView = state.view;
            }
            Object.assign(state, extra);
            state.view = view;
            syncHashRoute(view);
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

            const t = state.currentTeacher;

            if (phrase !== "ΔΙΑΓΡΑΦΗ") {
                showToast("Πληκτρολογήστε ΔΙΑΓΡΑΦΗ για επιβεβαίωση.");
                return;
            }
            db.teachers = db.teachers.filter(item => item.id !== t.id);
            db.classroomPosts = db.classroomPosts.filter(p => p.teacherName !== t.name);
            saveAppData();
            try { sessionStorage.clear(); } catch (e) {}

            syncHashRoute("teacher");

            render();

        // =====================================================================
        // 6. CONSENT-GATED EMAILJS AUTOMATION
        // =====================================================================
        async function sendAutomatedEmail(toEmail, toName, subject, messageBody) {
            if (state.cookieConsent !== "accepted") {
                return false;
            }
            if (!checkRateLimit("email_send", 8)) {
                showToast("Όριο αποστολής μηνυμάτων ανά λεπτό.");
                return false;
            }
            const { emailjsServiceId, emailjsTemplateId, emailjsPublicKey } = db.integrations || {};
            if (!emailjsServiceId || !emailjsTemplateId || !emailjsPublicKey) return false;
            try {
                if (!window.emailjs) {
                    await new Promise((resolve, reject) => {
                        const s = document.createElement("script");
                        s.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
                        s.onload = resolve;
                        s.onerror = reject;
                        document.head.appendChild(s);
                    });
                }
                if (window.emailjs) {
                    emailjs.init({ publicKey: emailjsPublicKey });
                    await emailjs.send(emailjsServiceId, emailjsTemplateId, {
                        to_email: toEmail,
                        to_name: toName,
                        subject: subject,
                        message: messageBody,
                        verification_code: messageBody
                    });
                    logActivity(`Στάλθηκε αυτόματο email ασφαλείας στο ${toEmail}.`, "EMAIL_SENT", toEmail);
                    return true;
                }
            } catch (err) {
                logActivity(`Αποτυχία αποστολής email προς ${toEmail}.`, "EMAIL_FAIL", toEmail);
            }
            return false;
        }

        function exportMyUserDataJson() {
            const t = state.currentTeacher;
            if (!t) return;
            const myPosts = db.classroomPosts.filter(p => p.teacherName === t.name);
            const payload = {
                exported_at: new Date().toISOString(),
                user: {
                    id: t.id,
                    name: t.name,
                    email: t.email,
                    specialty: t.specialty,
                    allowedCourseIds: t.allowedCourseIds,
                    active: t.active,
                    accepted_privacy_at: t.accepted_privacy_at || null,
                    createdAt: t.createdAt
                },
                classroom_posts: myPosts
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "my-data.json";
            a.click();
            logActivity(`Εξαγωγή προσωπικών δεδομένων (my-data.json) από ${t.email}.`, "DATA_EXPORT", t.id);
            showToast("Κατέβηκε το αρχείο my-data.json.");

            const target = db.teachers.find(x => x.id === t.id);

                return;

            const hp = (document.getElementById("regHpField")?.value || "").trim();

            const name = document.getElementById("regTName")?.value.trim();
            const specialty = document.getElementById("regTSpec")?.value.trim();
            const email = document.getElementById("regTEmail")?.value.trim().toLowerCase();
            const pass = document.getElementById("regTPass")?.value.trim();
            const gdprOk = !!document.getElementById("regTGdprCheck")?.checked;
            const allowedCourseIds = Array.from(document.querySelectorAll("input[name='regTAllowed']:checked")).map(el => el.value);

            if (!gdprOk) {
                showToast("Πρέπει να αποδεχτείτε την Πολιτική Απορρήτου και τους Όρους Χρήσης.");
                return;
            }
            if (!name || !specialty || !email || !isStrongPassword(pass)) {
                showToast("Συμπληρώστε όλα τα πεδία. Ο κωδικός πρέπει να έχει τουλ. 10 χαρακτήρες, πεζά, ΚΕΦΑΛΑΙΑ και αριθμό.");
                return;
            }
            if (containsSensitivePII(name) || containsSensitivePII(specialty)) {
                showToast("Προστασία GDPR: Μην καταχωρείτε τηλέφωνα, ΑΜΚΑ ή ΑΦΜ.");
                return;
            }
            if (!allowedCourseIds.length) {
                showToast("Επιλέξτε τουλάχιστον ένα μάθημα της ειδικότητάς σας.");
                return;
            }
            if (db.teachers.some(t => t.email.toLowerCase() === email)) {
                showToast("Υπάρχει ήδη λογαριασμός με αυτό το email.");
                return;
            }

            const passHash = await sha256Hex(pass);
            const isoNow = new Date().toISOString();
            const nowStr = new Date().toLocaleString("el-GR", { dateStyle: "short", timeStyle: "short" });
            db.teachers.push({
                id: "t" + Date.now(),
                name,
                email,
                passHash,
                specialty,
                allowedCourseIds,
                active: false,
                sessionVersion: 1,
                accepted_privacy_at: isoNow,
                createdAt: nowStr
            });
            saveAppData();
            state.teacherAuthMode = "login";
            logActivity(`Νέα εγγραφή εκπαιδευτικού (${email}) με accepted_privacy_at=${isoNow}.`, "USER_SIGNUP", email);
            await sendAutomatedEmail(
                email,
                name,
                "KonStudy — Αίτηση Εγγραφής Εκπαιδευτικού",
                `Λάβαμε την αίτηση εγγραφής σας στο KonStudy (${db.schoolInfo.name}), ${name}.\n\nΗμερομηνία αποδοχής GDPR: ${isoNow}\nΟ λογαριασμός βρίσκεται σε αναμονή επιβεβαίωσης από τον Διαχειριστή.`
            );
            showToast("Η εγγραφή ολοκληρώθηκε. Αναμένεται επιβεβαίωση από τον Διαχειριστή.");
            render();
        }

        async function loginTeacher() {
            touchActivity();
            const hp = (document.getElementById("loginHpField")?.value || "").trim();
            if (hp) {
                logActivity("Αποκλεισμός bot μέσω honeypot στη φόρμα σύνδεσης.", "BOT_BLOCKED", "HONEYPOT");
                return;
            }
            if (Date.now() < authGuard.teacherLockedUntil) {
                const secs = Math.ceil((authGuard.teacherLockedUntil - Date.now()) / 1000);
                showToast(`Προστασία ασφαλείας: Δοκιμάστε ξανά σε ${secs} δευτερόλεπτα.`);
                return;
            }

            const email = (document.getElementById("loginTEmail")?.value || "").trim().toLowerCase();
            const pass = (document.getElementById("loginTPass")?.value || "").trim();
            const t = db.teachers.find(x => x.email.toLowerCase() === email);
            if (!t) {
                authGuard.teacherFails++;
                if (authGuard.teacherFails >= 5) authGuard.teacherLockedUntil = Date.now() + 60000;
                logActivity(`Αποτυχημένη προσπάθεια σύνδεσης για email: ${email || "(κενό)"}.`, "LOGIN_FAILED", email || "UNKNOWN");
                showToast("Δεν βρέθηκε λογαριασμός εκπαιδευτικού με αυτό το email.");
                return;
            }
            const hash = await sha256Hex(pass);
            if (hash !== t.passHash) {
                authGuard.teacherFails++;
                if (authGuard.teacherFails >= 5) authGuard.teacherLockedUntil = Date.now() + 60000;
                logActivity(`Λάθος κωδικός σε προσπάθεια σύνδεσης για ${email}.`, "LOGIN_FAILED", email);
                showToast("Λάθος κωδικός πρόσβασης.");
                return;
            }
            if (!t.active) {
                logActivity(`Προσπάθεια σύνδεσης σε μη εγκεκριμένο λογαριασμό: ${email}.`, "LOGIN_PENDING", email);
                showToast("Ο λογαριασμός σας εκκρεμεί προς επιβεβαίωση από τον Διαχειριστή.");
                return;
            }

            authGuard.teacherFails = 0;
            state.currentTeacher = t;
            state.currentTeacherSessionVer = t.sessionVersion || 1;
            state.lastActivityAt = Date.now();
            state.teacherTab = "guide";
            const device = detectDeviceLabel();
            const nowStr = new Date().toLocaleString("el-GR");
            logActivity(`Σύνδεση καθηγητή: ${t.name} από ${device}.`, "LOGIN_SUCCESS", t.id);
            await sendAutomatedEmail(
                t.email,
                t.name,
                "KonStudy — Ειδοποίηση Νέας Σύνδεσης",
                `Καταγράφηκε νέα σύνδεση στον λογαριασμό εκπαιδευτικού σας (${t.name}) στο KonStudy.\n\nΣυσκευή: ${device}\nΏρα & Ημερομηνία: ${nowStr}`
            );
            showToast(`Καλώς ήρθατε, ${t.name}.`);
            render();
        }

        function runTeacherAiCommand() {
            touchActivity();
            if (!state.currentTeacher) return;
            if (!checkRateLimit(`ai_${state.currentTeacher.id}`, 12)) {
                showToast("Όριο εντολών AI ανά λεπτό. Δοκιμάστε ξανά σε λίγο.");
                return;
            }
            const inp = document.getElementById("teacherAiCmd");
            const q = (inp?.value || "").trim();
            if (!q) return;

            const myCourses = db.courses.filter(c => state.currentTeacher.allowedCourseIds.includes(c.id));
            const lower = q.toLowerCase();
            let reply = "";

            if (lower.includes("υλη") || lower.includes("ύλη") || lower.includes("κεφαλαι")) {
                reply = myCourses.map(c => `<strong>${esc(c.title)}</strong>:\n• ${c.units.map(u => esc(u)).join("\n• ")}`).join("\n\n");
            } else if (lower.includes("βιβλ") || lower.includes("διοφαντ") || lower.includes("διόφαντ")) {
                reply = myCourses.map(c => `<strong>${esc(c.title)}</strong>: <a href="${esc(c.bookUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--sky);font-weight:800;">Άνοιγμα Επίσημου Βιβλίου Διόφαντος ↗</a>`).join("\n");
            } else if (lower.includes("sos") || lower.includes("σος")) {
                const text = q.replace(/πρόσθεσε\s*sos\s*:?/i, "").trim();
                if (myCourses[0] && text && !containsSensitivePII(text)) {
                    myCourses[0].sos = (myCourses[0].sos ? myCourses[0].sos + "\n• " : "• ") + text;
                    saveAppData();
                    reply = `Προστέθηκε στα SOS του μαθήματος <strong>${esc(myCourses[0].title)}</strong>: «${esc(text)}»`;
                }
            } else {
                const secMatch = q.match(/\b([ΑΒΓ][1-3])\b/i);
                if (secMatch && !containsSensitivePII(q)) {
                    const sec = secMatch[1].toUpperCase();
                    db.classroomPosts.unshift({
                        id: "p_" + Date.now(),
                        sections: [sec],
                        teacherName: state.currentTeacher.name,
                        courseTitle: myCourses[0]?.title || state.currentTeacher.specialty,
                        text: q,
                        date: new Date().toLocaleString("el-GR", { dateStyle: "short", timeStyle: "short" })
                    });
                    saveAppData();
                    reply = `Δημοσιεύτηκε απευθείας στο Τμήμα <strong>${sec}</strong>.`;
                } else {
                    reply = `Διαθέσιμες εντολές:\n• «Πες μου την ύλη»\n• «Βρες μου το βιβλίο Διόφαντος»\n• «Πρόσθεσε SOS: ...»\n• «Ανέβασε στο Α1: ...»`;
                }
            }

            state.teacherAiHistory.unshift({ q, a: reply });
            if (inp) inp.value = "";
            render();
        }

        function saveTeacherCourseEdits(courseId) {
            touchActivity();
            if (!state.currentTeacher || !state.currentTeacher.allowedCourseIds.includes(courseId)) {
                showToast("Δεν έχετε δικαίωμα επεξεργασίας αυτού του μαθήματος.");
                return;

            const c = db.courses.find(x => x.id === courseId);
            if (!c) return;
            const sosVal = document.getElementById("editCourseSos")?.value || "";
            const notesVal = document.getElementById("editCourseNotes")?.value || "";
            const newUnit = (document.getElementById("newUnitInput")?.value || "").trim();
            if (containsSensitivePII(sosVal) || containsSensitivePII(notesVal) || containsSensitivePII(newUnit)) {
                showToast("Προστασία GDPR: Αφαιρέστε τηλέφωνα ή προσωπικά στοιχεία.");
                return;
            }
            c.sos = sosVal;
            c.notes = notesVal;
            if (newUnit) c.units.push(newUnit);
            saveAppData();
            logActivity(`Καθηγητής (${state.currentTeacher.name}): Ενημέρωσε το μάθημα ${c.title}.`, "COURSE_UPDATE", state.currentTeacher.id);
            showToast("Οι αλλαγές αποθηκεύτηκαν.");
            render();
        }

        async function handleTeacherFileUpload(event, courseId) {
            touchActivity();
            const file = event.target.files?.[0];
            const c = db.courses.find(x => x.id === courseId);
            if (!file || !c) return;

            const check = validateUploadFile(file, false);
            if (!check.ok) {
                event.target.value = "";
                showToast(check.reason);
                return;
            }

            try {
                if ((file.type || "").startsWith("image/")) {
                    c.photo = await compressPhotoDataUrl(file, 680, 0.68);
                    saveAppData();
                    showToast("Η εικόνα ελέγχθηκε (≤5MB), συμπιέστηκε και αποθηκεύτηκε.");
                } else {
                    const pdfNote = `\n[Επισυναπτόμενο αρχείο PDF: ${file.name} (${(file.size / 1024).toFixed(0)} KB)]`;
                    c.notes = (c.notes || "") + pdfNote;
                    saveAppData();
                    showToast(`Επικυρώθηκε το αρχείο ${file.name} (≤5MB) και καταχωρήθηκε στις σημειώσεις.`);
                }
                render();
            } catch (e) {
                showToast("Αδυναμία επεξεργασίας αρχείου.");
            }
        }

        function publishTeacherClassPost() {
            touchActivity();
            if (!state.currentTeacher) return;
            const secs = Array.from(document.querySelectorAll("input[name='postTargetSec']:checked")).map(el => el.value);
            const text = (document.getElementById("classPostText")?.value || "").trim();
            if (!secs.length || !text) {
                showToast("Επιλέξτε τουλάχιστον ένα τμήμα και γράψτε κείμενο.");
                return;
            }
            if (containsSensitivePII(text)) {
                showToast("Προστασία GDPR: Απαγορεύεται η ανάρτηση ευαίσθητων προσωπικών δεδομένων.");
                return;
            }
            const myCourse = db.courses.find(c => state.currentTeacher.allowedCourseIds.includes(c.id));
            db.classroomPosts.unshift({
                id: "p_" + Date.now(),
                sections: secs,
                teacherName: state.currentTeacher.name,
                courseTitle: myCourse ? myCourse.title : state.currentTeacher.specialty,
                text,
                date: new Date().toLocaleString("el-GR", { dateStyle: "short", timeStyle: "short" })
            });
            saveAppData();
            logActivity(`Καθηγητής (${state.currentTeacher.name}): Ανάρτηση στα τμήματα ${secs.join(", ")}.`, "CLASS_POST", state.currentTeacher.id);
            showToast(`Η ανάρτηση δημοσιεύτηκε στα τμήματα: ${secs.join(", ")}.`);
            render();
        }

        function updateScheduleCell(sec, day, hourIdx, val) {
            touchActivity();
            if (!state.currentTeacher) return;
            if (!db.schedule[sec]) db.schedule[sec] = {};
            if (!db.schedule[sec][day]) db.schedule[sec][day] = [];
            db.schedule[sec][day][hourIdx] = val;
            saveAppData();
            showToast(`Ενημερώθηκε το πρόγραμμα (${sec} • ${day} ${hourIdx + 1}η ώρα).`);
        }

        // =====================================================================
        // 13. ADMIN COMMAND CENTER (Role Enforcement + Audit Log + User Mgmt)
        // =====================================================================
        function renderAdminView() {
            if (!state.isAdminLoggedIn) {
                return `
                    <div style="max-width:440px;margin:0 auto;" class="view-enter">

                            <div>

                                <p class="muted" style="margin:4px 0 0;font-size:12.5px;">Εισάγετε τον κωδικό διαχείρισης για πρόσβαση (προεπιλογή: <span class="mono">12345</span>).</p>
                            </div>
                            <input id="adminHpField" class="hp-field" type="text" tabindex="-1" autocomplete="off">

            return `
                <div class="stack view-enter">

                        <div>
                            <div class="row">
                                <span class="badge badge-amber">role === 'admin'</span>
                                <h2>Κέντρο Διαχείρισης (Admin)</h2>
                            </div>

                    </div>

                    ${state.adminTab === "teachers" ? `

                                <div>
                                    <h3>Επιβεβαίωση &amp; Διαχείριση Λογαριασμών Καθηγητών (${db.teachers.length})</h3>
                                    <div class="muted" style="font-size:12px;">Επιβεβαιώστε νέους λογαριασμούς, αλλάξτε κωδικούς ή διαγράψτε λογαριασμό.</div>

                                <div>
                                    <button type="button" class="btn btn-sky btn-sm" onclick="saveIntegrations()">Αποθήκευση EmailJS</button>

                                    <div class="sub-box row-between">
                                        <strong style="color:var(--sky);font-size:13px;">Τμήμα ${s}</strong>
                                        <input type="text" style="width:130px;text-align:right;" class="mono" value="${esc(db.sectionCodes[s])}" onchange="db.sectionCodes['${s}']=this.value; saveAppData(); showToast('Ενημερώθηκε ο κωδικός για το ${s}');">

                        <div class="panel stack-sm">

        function requireAdminRole() {
            return state.isAdminLoggedIn === true;
        }

        function logoutAdmin() {
            state.isAdminLoggedIn = false;
            try { sessionStorage.clear(); } catch (e) {}
            logActivity("Έξοδος Διαχειριστή.", "ADMIN_LOGOUT", "ADMIN");
            render();
        }

        async function loginAdmin() {
            touchActivity();
            const hp = (document.getElementById("adminHpField")?.value || "").trim();
            if (hp) {
                logActivity("Αποκλεισμός bot μέσω honeypot στο Admin login.", "BOT_BLOCKED", "HONEYPOT");
                return;
            }
            if (Date.now() < authGuard.adminLockedUntil) {
                const secs = Math.ceil((authGuard.adminLockedUntil - Date.now()) / 1000);
                showToast(`Προστασία ασφαλείας: Δοκιμάστε ξανά σε ${secs} δευτερόλεπτα.`);
                return;
            }

            const pass = (document.getElementById("adminPassInput")?.value || "").trim();
            const hash = await sha256Hex(pass);
            const expectedDefault = await sha256Hex("12345");
            if (!db.adminPassHash) {
                db.adminPassHash = expectedDefault;
                saveAppData();
            }
            if (hash === db.adminPassHash || (pass === "12345" && db.adminPassHash === expectedDefault)) {
                authGuard.adminFails = 0;
                state.isAdminLoggedIn = true;
                state.lastActivityAt = Date.now();
                logActivity("Επιτυχής είσοδος Διαχειριστή.", "ADMIN_LOGIN_SUCCESS", "ADMIN");
                showToast("Καλώς ήρθατε στο Κέντρο Διαχείρισης.");
                render();
            } else {
                authGuard.adminFails++;
                if (authGuard.adminFails >= 5) authGuard.adminLockedUntil = Date.now() + 60000;
                logActivity("Αποτυχημένη προσπάθεια σύνδεσης Διαχειριστή.", "ADMIN_LOGIN_FAILED", "ADMIN");
                showToast("Λάθος κωδικός πρόσβασης.");
            }
        }

        async function changeAdminPassword() {
            if (!requireAdminRole()) return;
            const p = (document.getElementById("newAdminPassInp")?.value || "").trim();
            if (!isStrongPassword(p)) {
                showToast("Ο νέος κωδικός πρέπει να έχει τουλ. 10 χαρακτήρες, πεζά, ΚΕΦΑΛΑΙΑ και αριθμό.");
                return;
            }
            db.adminPassHash = await sha256Hex(p);
            saveAppData();
            logActivity("Admin: Αλλαγή κωδικού διαχειριστή.", "ADMIN_PASS_CHANGE", "ADMIN");
            showToast("Ο κωδικός διαχειριστή ενημερώθηκε.");
            render();
        }

        function saveIntegrations() {
            if (!requireAdminRole()) return;
            db.integrations.emailjsServiceId = (document.getElementById("ejsService")?.value || "").trim();
            db.integrations.emailjsTemplateId = (document.getElementById("ejsTemplate")?.value || "").trim();
            db.integrations.emailjsPublicKey = (document.getElementById("ejsPublic")?.value || "").trim();
            saveAppData();
            logActivity("Admin: Ενημέρωση ρυθμίσεων EmailJS.", "INTEGRATIONS_UPDATE", "ADMIN");
            showToast("Οι ρυθμίσεις EmailJS αποθηκεύτηκαν.");
        }

        async function adminToggleTeacherStatus(teacherId) {
            if (!requireAdminRole()) return;
            const t = db.teachers.find(x => x.id === teacherId);
            if (!t) return;
            t.active = !t.active;
            saveAppData();
            logActivity(
                `Admin: ${t.active ? "Ενεργοποίησε" : "Ανέστειλε"} τον λογαριασμό του/της ${t.name} (${t.email}).`,
                "ROLE_STATUS_CHANGE",
                "ADMIN"
            );
            await sendAutomatedEmail(
                t.email,
                t.name,
                `KonStudy — ${t.active ? "Επιβεβαίωση Λογαριασμού" : "Αναστολή Λογαριασμού"}`,
                t.active
                    ? `Ο λογαριασμός εκπαιδευτικού σας στο KonStudy επιβεβαιώθηκε από τον Διαχειριστή.`
                    : `Ο λογαριασμός εκπαιδευτικού σας στο KonStudy τέθηκε προσωρινά σε αναστολή.`
            );
            showToast(t.active ? `Ο λογαριασμός του/της ${t.name} επιβεβαιώθηκε.` : `Ο λογαριασμός ανεστάλη.`);
            render();
        }

        async function adminResetTeacherPassword(teacherId) {
            if (!requireAdminRole()) return;
            const t = db.teachers.find(x => x.id === teacherId);
            const inp = document.getElementById(`resetTPass_${teacherId}`);
            if (!t || !inp) return;
            const newPass = inp.value.trim();
            if (!isStrongPassword(newPass)) {
                showToast("Ο νέος κωδικός πρέπει να έχει τουλ. 10 χαρακτήρες, πεζά, ΚΕΦΑΛΑΙΑ και αριθμό.");
                return;
            }
            t.passHash = await sha256Hex(newPass);
            t.sessionVersion = (t.sessionVersion || 1) + 1;
            if (state.currentTeacher && state.currentTeacher.id === t.id) {
                state.currentTeacher = null;
                state.currentTeacherSessionVer = 0;
            }
            saveAppData();
            inp.value = "";
            logActivity(`Admin: Αλλαγή κωδικού & ακύρωση παλιών sessions για ${t.email}.`, "ADMIN_RESET_PASS", "ADMIN");
            await sendAutomatedEmail(
                t.email,
                t.name,
                "KonStudy — Ενημέρωση Κωδικού Πρόσβασης",
                `Ο Διαχειριστής ενημέρωσε τον κωδικό πρόσβασής σας στο KonStudy.\n\nΝέος Κωδικός: ${newPass}`
            );
            showToast(`Ο κωδικός του/της ${t.name} ενημερώθηκε.`);
            render();
        }

        function adminDeleteTeacher(teacherId) {
            if (!requireAdminRole()) return;
            const t = db.teachers.find(x => x.id === teacherId);
            if (!t) return;
            db.teachers = db.teachers.filter(x => x.id !== teacherId);
            db.classroomPosts = db.classroomPosts.filter(p => p.teacherName !== t.name);
            if (state.currentTeacher && state.currentTeacher.id === teacherId) {
                state.currentTeacher = null;
                state.currentTeacherSessionVer = 0;
            }
            saveAppData();
            logActivity(`Admin: Οριστική διαγραφή λογαριασμού (${t.email}).`, "ADMIN_DELETE_USER", "ADMIN");
            showToast(`Ο λογαριασμός του/της ${t.name} διαγράφηκε.`);
            render();
        }

        function exportReadyHtml() {
            if (!requireAdminRole()) return;
            const htmlDoc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "index.html";
            a.click();
            showToast("Κατέβηκε το έτοιμο index.html.");
        }

        // =====================================================================
        // 14. ULTRA-LIGHTWEIGHT VISIBILITY-AWARE AMBIENT CANVAS & TIMERS
        // =====================================================================
        function initAmbientCanvas() {
            const canvas = document.getElementById("ambientCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let w = (canvas.width = window.innerWidth);
            let h = (canvas.height = window.innerHeight);

            window.addEventListener("resize", () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }, { passive: true });

            const nodes = Array.from({ length: 22 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.22,
                vy: (Math.random() - 0.5) * 0.22,
                r: 1.2 + Math.random()
            }));

            let lastTime = 0;
            function frame(ts) {
                if (!document.hidden && ts - lastTime > 42) {
                    lastTime = ts;
                    ctx.clearRect(0, 0, w, h);
                    ctx.fillStyle = "rgba(56, 189, 248, 0.34)";
                    for (let i = 0; i < nodes.length; i++) {
                        const p = nodes[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > w) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        function applyInitialHashView() {
            const h = (window.location.hash || "").toLowerCase();
            if (h === "#/privacy") state.view = "privacy";
            else if (h === "#/terms") state.view = "terms";
            else if (h === "#/sections") state.view = "sections";
            else if (h === "#/schedule") state.view = "schedule";
            else if (h === "#/exams") state.view = "exams";
            else if (h === "#/teacher") state.view = "teacher";
            else if (h === "#/admin") state.view = "admin";
            else if (h === "#/delete-account") state.view = "deleteAccount";
            else state.view = "home";
        }

        window.addEventListener("hashchange", () => {
            applyInitialHashView();
            render();
        });

        window.onload = function () {
            applyInitialHashView();
            ["click", "keydown", "mousemove", "scroll"].forEach(ev => {
                window.addEventListener(ev, touchActivity, { passive: true });
            });
            setInterval(enforceSessionTimeout, 30000);
            render();
            initAmbientCanvas();
        },
    </script>
